<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f4ee">
    <title>Daymark | Your tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Daymark home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>daymark</span>
        </a>
        <time class="today-label" id="today-label"></time>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">A FRESH PAGE</p>
          <h1 id="page-title">Make today <span>count.</span></h1>
          <p class="intro-note">One thing at a time.</p>
        </section>

        <div class="workspace">
          <section class="task-column" aria-labelledby="list-title">
            <div class="section-heading">
              <div>
                <p class="eyebrow">YOUR DAY</p>
                <h2 id="list-title">The list</h2>
              </div>
              <span class="task-total" id="task-total">0 tasks</span>
            </div>

            <form class="add-form" id="add-form">
              <label class="visually-hidden" for="task-input">Add a task</label>
              <input
                id="task-input"
                name="title"
                type="text"
                maxlength="240"
                placeholder="What needs doing?"
                autocomplete="off"
                required
              >
              <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
            </form>

            <div class="list-toolbar">
              <div class="filters" role="group" aria-label="Filter tasks">
                <button class="filter-button is-selected" type="button" data-filter="all" aria-pressed="true">All</button>
                <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
                <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
              </div>
              <button class="text-button" id="clear-completed" type="button" hidden>Clear completed</button>
            </div>

            <ul class="task-list" id="task-list" aria-live="polite" aria-relevant="additions removals text"></ul>
            <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
          </section>

          <aside class="progress-column" aria-labelledby="progress-title">
            <div class="progress-heading">
              <p class="eyebrow">AT A GLANCE</p>
              <h2 id="progress-title">Your progress</h2>
            </div>
            <div class="progress-count">
              <span class="progress-number" id="completed-count">0</span>
              <span class="progress-caption">of <strong id="total-count">0</strong> tasks done</span>
            </div>
            <div
              class="progress-track"
              id="progress-track"
              role="progressbar"
              aria-label="Tasks completed"
              aria-valuemin="0"
              aria-valuemax="0"
              aria-valuenow="0"
            >
              <span class="progress-fill" id="progress-fill"></span>
            </div>
            <p class="progress-note" id="progress-note">Add a task to get started.</p>
            <div class="aside-rule"></div>
            <p class="aside-footnote">Small steps add up.</p>
          </aside>
        </div>
      </main>

      <footer class="footer"><span>DAYMARK</span><span>Make space for what matters.</span></footer>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
